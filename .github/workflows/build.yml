name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Jer.exe
        shell: pwsh
        run: |
          # Tags (v2.0.1) set the version; every other build uses <Version> from Jer.csproj.
          $versionArgs = @()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $versionArgs = @("-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))") }
          dotnet publish src/Jer/Jer.csproj -c Release -o publish @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Jer.exe is the whole app: .NET Framework 4.8 is part of Windows 10 (1903+) and Windows 11.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/Jer.exe dist/Jer.exe
          $info = (Get-Item dist/Jer.exe).VersionInfo
          "Jer.exe {0}: {1:N0} bytes" -f $info.FileVersion, (Get-Item dist/Jer.exe).Length

      - name: Smoke test (start Jer, drive it, take screenshots)
        shell: pwsh
        run: ./build/smoke-test.ps1 -Exe dist/Jer.exe -OutDir screenshots

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Jer.exe -DestinationPath dist/Jer.zip
          $lines = foreach ($file in 'Jer.exe', 'Jer.zip') {
            $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          # LF line endings so `sha256sum -c` works on Linux and macOS too.
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Jer
          path: dist/Jer.exe

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Jer ${{ github.ref_name }}
          fail_on_unmatched_files: true
          make_latest: "true"
          files: |
            dist/Jer.exe
            dist/Jer.zip
            dist/SHA256SUMS.txt
          body_path: build/release-notes.md
