name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Jer.exe (x64 and arm64)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Jer/Jer.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$version `
              -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Smoke test (start Jer, drive it, take screenshots)
        shell: pwsh
        run: ./build/smoke-test.ps1 -Exe publish/win-x64/Jer.exe -OutDir screenshots

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/Jer.exe -DestinationPath Jer-win-x64.zip
          Compress-Archive -Path publish/win-arm64/Jer.exe -DestinationPath Jer-win-arm64.zip
          $files = 'Jer-win-x64.zip', 'Jer-win-arm64.zip', 'publish/win-x64/Jer.exe', 'publish/win-arm64/Jer.exe'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file -replace '^publish/', '')"
          }
          # LF line endings so `sha256sum -c` works on Linux and macOS too.
          [System.IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Jer-win-x64
          path: publish/win-x64/Jer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: Jer-win-arm64
          path: publish/win-arm64/Jer.exe

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Jer ${{ github.ref_name }}
          fail_on_unmatched_files: true
          make_latest: "true"
          files: |
            Jer-win-x64.zip
            Jer-win-arm64.zip
            SHA256SUMS.txt
          body: |
            Jer ${{ github.ref_name }}, a living notch for Windows 10 (1809 or later) and Windows 11, 64-bit.

            **Download**
            - `Jer-win-x64.zip` for most PCs
            - `Jer-win-arm64.zip` for Windows on ARM (Snapdragon)

            Extract the zip and run `Jer.exe`. No installer and no .NET install needed. Windows SmartScreen may warn because the app is new and not signed: choose **More info → Run anyway**. `SHA256SUMS.txt` lists the SHA-256 of every file so you can check your download.

            **Unduh (Bahasa Indonesia)**: ambil `Jer-win-x64.zip`, ekstrak, lalu jalankan `Jer.exe`. Kalau muncul peringatan SmartScreen, pilih **More info → Run anyway**.

            Settings: click the Jer icon next to the clock. Move the notch to another display in **Settings → Display** or from the tray menu under **Show notch on**.
